name: DriveDB entry - missing or incorrect
description: Report a drive that is missing from drivedb, or has wrong SMART attribute definitions.
labels: [drivedb]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** test with the latest drivedb first.

        ```bash
        smartctl --drivedb=/path/to/latest/drivedb.h -a /dev/sdX
        ```

        Download the latest: https://github.com/smartmontools/smartmontools/raw/master/drivedb/drivedb.h

        If the problem still appears with the latest drivedb, continue below.

  - type: input
    id: model
    attributes:
      label: Drive model string
      description: >
        Exact string from `smartctl -i` — "Device Model" for ATA, "Product" for USB.
        Copy-paste; do not retype.
      placeholder: "WDC WD40EFRX-68WT0N0"
    validations:
      required: true

  - type: input
    id: family
    attributes:
      label: Drive family (informal name)
      description: Your best guess is fine — e.g. "Western Digital Red Plus", "Samsung 870 EVO".
      placeholder: "Western Digital Red Plus"

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: >
        "Firmware Version" line from `smartctl -i`.
      placeholder: "82.00A82"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - ATA (SATA / PATA)
        - USB-ATA bridge
    validations:
      required: true

  - type: input
    id: usb_bridge
    attributes:
      label: USB bridge chip (USB only)
      description: >
        Reported in `smartctl -i` as "USB ID" or bridge name.
        Leave blank for ATA drives.
      placeholder: "JMicron JMS578  (0x152d:0x0578)"

  - type: checkboxes
    id: problem_type
    attributes:
      label: What is wrong?
      options:
        - label: Drive is completely missing from drivedb
        - label: Wrong or missing attribute name
        - label: Wrong attribute raw-value type (e.g. raw48 vs raw16)
        - label: Wrong or missing failure threshold
        - label: Wrong or missing firmware bug fix flag (-F)
        - label: Other (describe below)
    validations:
      required: true

  - type: textarea
    id: smartctl_output
    attributes:
      label: Full `smartctl -a` output
      description: Wrap in a code block. Redact serial number if you prefer.
      placeholder: |
        ```
        smartctl 7.5 2023-01-01 r5400 ...
        ...
        ```
    validations:
      required: true

  - type: input
    id: datasheet
    attributes:
      label: Datasheet / product page URL (optional)
      description: >
        Link to the manufacturer datasheet or product page. Helps maintainers
        verify attribute definitions without owning the drive.
      placeholder: "https://www.example.com/datasheet/WD-Red-DS.pdf"

  - type: textarea
    id: other_models
    attributes:
      label: Other model numbers in this family (optional)
      description: >
        List any other model strings that belong to the same drive family but
        are not covered by your proposed regex. One model per line, copied
        exactly from `smartctl -i`.
      placeholder: |
        MEMPEK1W016GA
        MEMPEK1W032GA
        MEMPEI1W016GA
        MEMPEK1J016GA

  - type: input
    id: proposed_regexp
    attributes:
      label: Proposed modelregexp (optional)
      description: >
        POSIX extended regex to match your drive model(s). Use `.` as a
        single-character wildcard where model variants differ — e.g.
        `MEMPE.1.0..GA` matches `MEMPEK1W016GA`, `MEMPEI1J032GA`, etc.
        Test your regex at https://www.debuggex.com/ (select POSIX ERE).
        Leave blank if unsure.
      placeholder: "MEMPE.1.0..GA"

  - type: textarea
    id: suggested_presets
    attributes:
      label: Suggested presets (optional)
      description: >
        If you already know the correct `-v` flags, add them here.
        See the [drivedb format](../drivedb/yaml/ata/) for examples.
      placeholder: |
        -v 190,tempminmax,Airflow_Temperature_Cel
        -v 194,tempminmax,Temperature_Celsius

  - type: input
    id: version
    attributes:
      label: smartmontools version
      description: From `smartctl --version`.
      placeholder: "7.5"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        Want this fixed faster? Send a pull request.

        Adding a drive entry yourself takes about 10 minutes and gets your fix
        merged without waiting for someone else to own a similar drive.

        Step 1 — Fork
        Click the **Fork** button in the top-right corner of the repository:
        https://github.com/smartmontools/smartmontools

        Step 2 — Clone your fork
        ```bash
        git clone https://github.com/<your-username>/smartmontools.git
        cd smartmontools
        ```

        Step 3 — Create a branch
        ```bash
        git checkout -b drivedb/<vendor>-<family>
        ```

        Step 4 — Add or edit the YAML file
        ```
        ATA:  drivedb/yaml/ata/<vendor>/<family>.yaml
        USB:  drivedb/yaml/usb/<vendor>/<product>.yaml
        ```
        Edit the file so your drive shows the correct attribute names when you run `smartctl -a`.
        See `CONTRIBUTING.md` for field descriptions and an example entry.

        Step 5 — Regenerate and test
        ```bash
        python3 drivedb/yaml_to_drivedb.py > drivedb/drivedb.h
        python3 drivedb/verify_drivedb.py
        smartctl --drivedb=drivedb/drivedb.h -a /dev/sdX
        ```

        Step 6 — Commit and push
        ```bash
        git add drivedb/yaml/<vendor>/<family>.yaml drivedb/drivedb.h
        git commit -m "drivedb: add <Family Name>"
        git push -u origin drivedb/<vendor>-<family>
        ```

        Step 7 — Open a pull request
        Go to your fork on GitHub. A banner will appear — click **Compare & pull request**.
        The PR template will guide you through the final checklist.
        
